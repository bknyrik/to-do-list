<ul class="sidebar-nav list-group">
  <li class="list-group-item">
    <a class="text-decoration-none" href="{% url "task_manager:task-list" %}">Home</a>
  </li>
  <li class="list-group-item">
    <a class="text-decoration-none" href="{% url "task_manager:tag-list" %}">Tags</a>
  </li>
  {% if request.user.is_authenticated %}
    {% if request.user.is_staff %}
      <li class="list-group-item">
        <a class="text-decoration-none" href="{% url "task_manager:user-list" %}">Users</a>
      </li>
    {% endif %}
    <li class="list-group-item">
      <a class="text-decoration-none"
         href="{% url "task_manager:user-update" pk=request.user.id %}">{{ request.user.username }}</a>
    </li>
    <li class="list-group-item bg-primary">
      <form action="{% url "logout" %}" method="post">
        {% csrf_token %}
        <input class="link-light text-decoration-none border-0 bg-primary" type="submit" value="Log out">
      </form>
    </li>
  {% else %}
    <li class="list-group-item bg-primary">
      <a class="text-light text-decoration-none" href="{% url "task_manager:user-create" %}">Sign up</a>
    </li>
    <li class="list-group-item bg-primary">
      <a class="text-light text-decoration-none" href="{% url "login" %}">Log in</a>
    </li>
  {% endif %}
</ul>
